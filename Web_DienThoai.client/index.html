<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <meta
      name="description"
      content="TechStore - Chuyên điện thoại, phụ kiện chính hãng, giá tốt"
    />
    <meta
      name="keywords"
      content="điện thoại, iPhone, Samsung, phụ kiện, TechStore"
    />
    <meta name="author" content="TechStore" />

    <!-- Favicon -->
    <link rel="icon" href="/logo.png" />

    <!-- Font công nghệ -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Title -->
    <title>TechStore - Mua sắm công nghệ chính hãng</title>

    <!-- Theme color -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Global style -->
    <style>
      :root {
        --primary: #2563eb;
        --secondary: #0f172a;
        --bg: #f8fafc;
        --text: #0f172a;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* Loading screen */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        color: var(--primary);
        z-index: 9999;
      }
    </style>
  </head>

  <body>
    <!-- Loading -->
    <div id="loading">Đang tải TechStore...</div>

    <!-- App -->
    <div id="root"></div>

    <!-- Script -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Remove loading -->
    <script>
      window.addEventListener("load", () => {
        const loading = document.getElementById("loading");
        if (loading) loading.remove();
      });
    </script>
  </body>
</html>
